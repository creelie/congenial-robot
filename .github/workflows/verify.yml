name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: C and Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nauty and python-sat
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends nauty
          pip install python-sat
      - run: scripts/run_all.sh
      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks
          path: build/*.txt

  lean:
    name: Lean 4 proof with Mathlib and axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib's build cache
        working-directory: lean
        run: lake exe cache get
      - name: Build
        working-directory: lean
        run: |
          lake build 2>&1 | tee ../lean-build.txt
          ! grep -q "declaration uses 'sorry'" ../lean-build.txt
      - name: Axiom audit
        working-directory: lean
        run: |
          lake env lean Check.lean 2>&1 | tee ../lean-check.txt
          python3 ../scripts/audit_axioms.py ../lean-check.txt
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-logs
          path: lean-*.txt

  paper:
    name: Build the paper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended lmodern poppler-utils zip
      - run: scripts/build_paper.sh
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: dist/
